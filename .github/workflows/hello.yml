name: My First GitHub Action

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show current directory
        run: pwd

      - name: List files
        run: ls -la

      - name: Run hello script
        run: ./hello.sh
